app = 'tokamak-dao-agent'
primary_region = 'nrt'

[build]
  [build.args]
    VITE_REOWN_PROJECT_ID = "ed9db8435ea432ec164cf02c06c0b969"

[env]
  ELIZAOS_URL = "https://tokamak-dao-agent-elizaos.fly.dev"
  ALLOWED_ORIGINS = "https://tokamak-dao-agent.fly.dev"
  DB_PATH = "/data/forum.db"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

# MCP SSE server (internal only, for ElizaOS)
[[services]]
  internal_port = 3001
  protocol = "tcp"

  [[services.ports]]
    port = 3001

[checks]
  [checks.health]
    type = 'http'
    port = 3333
    path = '/api/health'
    interval = '30s'
    timeout = '5s'

  [checks.mcp_sse]
    type = 'http'
    port = 3001
    path = '/health'
    interval = '30s'
    timeout = '5s'

[mounts]
  source = "forum_data"
  destination = "/data"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
