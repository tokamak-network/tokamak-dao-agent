services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
      - "3001:3001"
    env_file: .env
    environment:
      - PORT=3333
      - MCP_SSE_PORT=3001
      - ELIZAOS_URL=http://elizaos:3000
    volumes:
      - forum_data:/data
    depends_on:
      - elizaos

  elizaos:
    build:
      context: ./elizaos
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - ELIZAOS_MCP_URL=http://web:3001/sse
    volumes:
      - elizaos_data:/data/.eliza

volumes:
  forum_data:
  elizaos_data:
